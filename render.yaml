# NOT the live deployment. Mail Sniff runs on the company server at
# https://mail-sniff.apps.iv1.in (see deploy/README.md). This Blueprint is
# kept only as a fallback for standing the app up somewhere quickly.
services:
  - type: web
    name: mail-sniff
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeploy: true
    healthCheckPath: /api/v1/health
    envVars:
      # Render generates a strong secret itself; read it in the dashboard under
      # Environment. Without a key the API is world-callable.
      - key: MAILSNIFF_API_KEY
        generateValue: true
      # Set this to your app's origin (https://yourapp.com) in the dashboard so
      # only your tool's browser code can call the API. Defaults to * in code.
      - key: ALLOWED_ORIGINS
        sync: false
